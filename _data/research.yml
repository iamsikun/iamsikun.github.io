working_papers:
  - id: causal-representation-learning
    slug: causal-representation
    title: "A Causal Approach to Representation Learning for Unstructured Data"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5309826"
    url_type: "SSRN"
    authors_html: "<strong>Sikun Xu</strong>, Zhenling Jiang, Zhengling Qi, and Dennis Zhang"
    status_html: "Major revision at <strong><em>Management Science</em></strong>. Accepted to 19th Annual Bass FORMS Conference (2025)."
    abstract: |
      The increasing availability of unstructured data (e.g., images) in business and economics research has created new opportunities to control for confounders. A common approach is embedding-then-inference, where unstructured data is compressed into low-dimensional embeddings and incorporated into causal models. However, we show that this method can introduce significant bias because representation learning models optimized for reconstruction may miss relevant confounders. To address this, we propose causal embeddings, which explicitly align the objective of representation learning with the causal task by jointly predicting both treatment and outcome variables. This approach captures confounding information while maintaining low-dimensional efficiency and accommodates various embedding methods, including fine-tuned pretrained models. Simulations demonstrate that causal embeddings outperform both embedding-then-inference and direct adjustment with double machine learning (DML) in subsequent causal inference tasks. A real-world application further highlights the practical importance of properly accounting for unstructured data in causal models.
  - id: winners-curse-data-driven-decision-making
    slug: winners-curse
    title: "The Winner's Curse in Data-Driven Decision-Making: Evidence and Solutions"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5930537"
    url_type: "SSRN"
    authors_html: "<strong>Sikun Xu</strong>, Raphael Thomadsen and Dennis Zhang"
    status_html: "Submitted. Accepted to SICS 2025."
    abstract: |
      Data-driven decision making involves estimating the value of each potential option and selecting the one with the highest estimated efficacy.
      This approach underpins a wide array of modern marketing, operations, and AI applications, including A/B testing, advertising and bidding, pricing, and personalized targeting. However, several papers have shown that the estimated effectiveness of the chosen options will be systematically over-optimistic (Smith and Winkler 2006, Efron 2011, Andrews et al. 2024), even when the estimated outcomes are themselves unbiased and efficient. Using simulations calibrated to realistic parameter values from recent marketing studies, we first demonstrate that the magnitude of the winner's curse is often high in relevant marketing contexts, and that the severity of the winner's curse depends on the true performance difference between options relative to the level of noise in the data, the number of alternatives under consideration, and the number of observations per tested condition. We further show that using machine learning methods to evaluate what treatment to give to individual consumers can lead to extremely high levels of winner's curse, especially if the machine learning functional form is very flexible. We propose a correction method based on a non-continuous bootstrap, and benchmark our method against several existing proposed solutions across many common marketing scenarios. We demonstrate that our bootstrap approach generally performs well, and usually outperforms the solutions that have been previously proposed in the literature.
  - id: llm-leaderboard-winners-curse
    slug: sota-or-luck
    title: "SOTA or Luck? The Winner’s Curse in LLM Leaderboards"
    url: "https://arxiv.org/abs/2611.22227"
    url_type: "arXiv"
    links:
      - label: "Website"
        url: "https://sikunxu.com/llm-wc/"
    authors_html: "<strong>Sikun Xu</strong>, Raphael Thomadsen, Dennis Zhang, and Heng Zhang"
    abstract: |
      Public LLM leaderboards guide model evaluation and adoption, yet the reported performance of top-ranked models can be systematically overstated. This leaderboard winner's curse arises because ranking noisy benchmark scores rewards sampling luck alongside genuine ability. The same selection effect can distort scores throughout the leaderboard, a phenomenon we call the rank-induced bias. We develop an $m$-out-of-$N$ bootstrap to correct for this bias. It assumes a fixed model pool with independent, identically distributed bounded tasks while allowing arbitrary within-task correlation among models. Under exact population tiers separated by positive gaps, we prove that the bootstrap reduces $\Theta(N^{-1/2})$ ranking bias to expected residual bias $o(N^{-1/2})$. Across 14 benchmarks from 5 benchmark families, the rank-1 adjustments range from approximately 0.09 to 3.86 percentage points. In our SWE-bench Verified snapshot, the tied leaders receive an adjustment of 0.90 percentage points. Such overstatement is large enough to make the apparent winner statistically fragile. Thus, we use the same bootstrap to further quantify the intervals of plausible rank positions for each model and group models into tiers. We establish sufficient conditions for consistent recovery of population tiers. On SWE-bench Verified, this procedure places 13 of 173 models in the leading tier. We combine the score adjustment and rank intervals in the Rank Uncertainty and Leaderboard Evaluation Report (RULER). We validate its finite-sample performance using sample splitting and calibrated simulations, and advocate publishing RULER alongside raw rankings so readers can assess both reported performance and the precision of the ordering. RULER also provides guidance for benchmark design that accounts for selection effects and ranking uncertainty.

conference_proceedings:
  - id: optimal-real-data-allocation
    slug: real-data-allocation
    title: "Optimal Real Data Allocation for Synthetic Data Augmented Inference."
    url: "https://neurips.cc/virtual/2026/loc/atlanta/poster/148327"
    url_type: "NeurIPS"
    authors_html: "<strong>Sikun Xu</strong>, Zineng Xu, and Mingduo Zhao"
    venue_html: "Advances in Neural Information Processing Systems (NeurIPS 2026). Forthcoming."
    abstract: |
      Generative models have made synthetic data inexpensive, but generated observations can be biased. When real data are scarce and more costly, researchers must decide how much of the real sample to use for direct estimation and how much to devote to calibrating the generator. We study this allocation problem by jointly choosing the calibration size and the weight assigned to real and synthetic estimates to minimize mean squared error (MSE). Our model separates calibration error from synthetic sampling noise and yields a marginal value condition: at an interior optimum, the precision gained from one additional calibration observation equals the precision lost from direct estimation. A six case phase diagram characterizes how the optimal allocation depends on how quickly calibration improves the generator and how synthetic sample size grows with the real data budget. Suppose the synthetic sample grows in proportion to the budget for real data, $n$. Using $x$ real observations for calibration reduces the mean squared calibration error at rate $x^{-2\beta}$, where $\beta>1/2$. The oracle then chooses a calibration sample size that grows at rate $n^{2/(2\beta+1)}$. Thus, a larger budget calls for more calibration observations, but these observations make up a smaller share of the real sample. The optimal calibration share therefore vanishes, yet the oracle achieves a smaller leading MSE constant than real-only estimation. In contrast, rules that allocate a fixed positive fraction to calibration eventually over calibrate. We also propose a pilot based grid selector and show that its selected allocation asymptotically attains the lowest working risk among grid candidates when relative risk estimation error vanishes uniformly. In a representative Gaussian simulation, the oracle reduces MSE by about 47\% relative to real-only estimation, compared with about 22\% for a fixed share heuristic.
  - id: polynomial-optimality-determinant-relaxation
    slug: determinant-relaxation
    title: "Verifying Global Optimality of Candidate Solutions to Polynomial Optimization Problems using a Determinant Relaxation Hierarchy."
    url: "https://ieeexplore.ieee.org/document/9683608"
    url_type: "IEEE"
    authors_html: "<strong>Sikun Xu</strong>, Ruoyi Ma, Daniel K. Molzahn, Hassan Hijazi, and Cédric Josz"
    venue_html: "60th IEEE Conference on Decision and Control (CDC 2021)"
    abstract: |
      We propose an approach for verifying that a given feasible point for a polynomial optimization problem is globally optimal. The approach relies on the Lasserre hierarchy and the result of Lasserre regarding the importance of the convexity of the feasible set as opposed to that of the individual constraints. By focusing solely on certifying global optimality and relaxing the Lasserre hierarchy using necessary conditions for positive semidefiniteness based on matrix determinants, the proposed method is implementable as a computationally tractable linear program. We demonstrate this method via application to several instances of polynomial optimization, including the optimal power flow problem used to operate electric power systems.

