<!-- Floating "Ask about Sikun's research" chat widget. -->
<link rel="stylesheet" href="{{ '/assets/css/chat-widget.css' | relative_url }}">

<div id="chat-widget" class="chat-widget" data-state="closed">
  <button type="button"
          class="chat-widget__bubble"
          aria-label="Open chat — ask about Sikun's research"
          aria-expanded="false"
          aria-controls="chat-widget-panel">
    <svg class="chat-widget__bubble-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H8l-4 4V6a1 1 0 0 1 1-1Z"
            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="9" cy="11" r="1" fill="currentColor"/>
      <circle cx="13" cy="11" r="1" fill="currentColor"/>
      <circle cx="17" cy="11" r="1" fill="currentColor"/>
    </svg>
    <span class="chat-widget__bubble-label">Ask about my research</span>
  </button>

  <div id="chat-widget-panel"
       class="chat-widget__panel"
       role="dialog"
       aria-modal="false"
       aria-labelledby="chat-widget-title"
       hidden>
    <header class="chat-widget__header">
      <div class="chat-widget__title-block">
        <h2 id="chat-widget-title" class="chat-widget__title">Ask about Sikun's research</h2>
        <span class="chat-widget__model-badge" data-role="model-badge">via Gemini 2.0 Flash</span>
      </div>
      <button type="button" class="chat-widget__close" aria-label="Close chat">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="20" height="20">
          <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="chat-widget__messages" data-role="messages" role="log" aria-live="polite">
      <div class="chat-widget__welcome" data-role="welcome">
        <p class="chat-widget__welcome-text">
          Hi — I'm an AI assistant trained on Sikun's website. Ask me about her
          research, papers, teaching, or background.
        </p>
        <div class="chat-widget__starters" data-role="starters">
          <button type="button" class="chat-widget__starter">What does Sikun work on?</button>
          <button type="button" class="chat-widget__starter">Tell me about the winner's curse paper.</button>
          <button type="button" class="chat-widget__starter">Where has she taught?</button>
        </div>
      </div>
    </div>

    <form class="chat-widget__input" data-role="form" autocomplete="off">
      <input type="text"
             class="chat-widget__input-field"
             data-role="input"
             placeholder="Ask a question…"
             maxlength="500"
             aria-label="Your question" />
      <button type="submit" class="chat-widget__send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="18" height="18">
          <path d="M4 12l16-7-7 16-2-7-7-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <footer class="chat-widget__footer">
      AI-generated · <span data-role="footer-model">Gemini 2.0 Flash</span> · may contain errors —
      verify against the
      <a href="{{ '/' | relative_url }}">linked papers</a>.
    </footer>
  </div>
</div>

<script src="{{ '/assets/js/chat-widget.js' | relative_url }}" defer></script>
